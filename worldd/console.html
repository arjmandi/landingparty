<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Zo12TmUcGpsW+OfM2U38vExUPHLiP+AvTvCLZ8Sx8Qg='; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; form-action 'none'; base-uri 'none'"><title>Landing Party · Bridge</title>
<style>
:root{color-scheme:dark}body{max-width:76rem;margin:2rem auto;padding:0 1.5rem;background:#10191f;color:#d8e6e9;font:15px/1.6 system-ui}h1,h2{font-weight:500}small,label{color:#a8bec6}article,details{border:1px solid #334852;padding:1rem;margin:1rem 0;border-radius:5px}button,input,select,textarea{font:inherit;padding:.5rem;background:#182a32;color:inherit;border:1px solid #49626d;border-radius:3px}button{cursor:pointer;margin:.25rem}textarea{display:block;width:95%;min-height:5rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#13232b;padding:.7rem}label{display:block;margin:.5rem 0}.error{color:#ffb2a6}.row{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}summary{cursor:pointer}#credential{width:24rem}section{margin:2rem 0}img{display:block;max-width:100%;border:1px solid #334852}button:disabled{opacity:.6;cursor:wait}
</style>
<h1>Landing Party <small>the bridge</small></h1>
<p>Researcher console · tickets, standing orders, active human time, and exclusive browser takeover.</p>
<div class="row"><label>Researcher control token <input id="credential" type="password" autocomplete="off"></label><button id="connect">Connect / refresh</button></div>
<p id="error" class="error" role="alert"></p><p id="notice" role="status"></p>
<section><h2>Runs</h2><main id="runs"></main></section>
<section><h2>Tickets</h2><p>Open a ticket to begin tracking active console time. Classify the ask when answering.</p><div id="tickets"></div></section>
<section><h2>Browser sessions</h2><div id="sessions"></div></section>
<script>
'use strict';
if(window.top!==window.self){document.body.textContent='Open the bridge directly to use researcher controls.';throw Error('Embedded bridge disabled');}
let controlToken='',idleTimer=null;const openTickets=new Set(),activityCursors=new Map(),issuedPayments=new Set();let touchQueue=Promise.resolve();
const node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
const json=(value)=>JSON.stringify(value,null,2);
async function api(path,body){const headers={};if(controlToken)headers['X-World-Control-Token']=controlToken;if(body!==undefined)headers['Content-Type']='application/json';const response=await fetch(path,{method:body===undefined?'GET':'POST',headers,cache:'no-store',credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok||data?.kind==='blocked')throw Error(typeof data.detail==='string'?data.detail:json(data.detail||data));return data;}
function button(label,action){const b=node('button',label);b.type='button';b.addEventListener('click',()=>guard(async()=>{if(b.disabled)return;b.disabled=true;try{await action();}finally{b.disabled=false;}}));return b;}
async function guard(action){document.querySelector('#error').textContent='';try{await action();}catch(e){document.querySelector('#error').textContent=e.message;}}
function input(label,type='text'){const wrap=node('label',label+' ');const field=node(type==='textarea'?'textarea':'input');if(type!=='textarea')field.type=type;field.autocomplete='off';field.spellcheck=false;wrap.append(field);return {wrap,field};}
async function touch(id,active){touchQueue=touchQueue.catch(()=>{}).then(()=>api('/v1/asks/'+encodeURIComponent(id)+'/touch',{active}));return touchQueue;}
async function focusTicket(id){for(const previous of openTickets)if(previous!==id)await touch(previous,false);openTickets.clear();openTickets.add(id);await touch(id,document.visibilityState==='visible'&&document.hasFocus());activity();}
function parseObject(field){let value;try{value=JSON.parse(field.value);}catch{throw Error('Enter a valid JSON object.');}if(!value||typeof value!=='object'||Array.isArray(value))throw Error('Enter a JSON object.');return value;}
function activity(){clearTimeout(idleTimer);if(openTickets.size&&document.visibilityState==='visible'&&document.hasFocus()){guard(visibility);idleTimer=setTimeout(()=>guard(async()=>{for(const id of openTickets)await touch(id,false);}),30000);}}
async function incomingIncidentReports(run,panel){
 const queue=await api('/v1/public-incident-reports?run_id='+encodeURIComponent(run.run_id));panel.append(node('h3','Incoming public incident reports'));
 for(const report of queue.reports){const row=node('article'),platform=input('Triage platform'),owner=input('Triage human owner'),kind=node('select');owner.field.value=report.owner||'';for(const value of ['complaint','takedown','suspension','spam','retraction'])kind.append(node('option',value));row.append(node('strong',report.report_id),node('p','Unverified public report. A responsible human must review it before any authority is withdrawn.'),node('pre',json({report:report.report,contact:report.contact,identity_id:report.identity_id,body_hash:report.body_hash})),platform.wrap,owner.wrap,kind,button('Accept report and revoke affected authority',async()=>{await api('/v1/public-incident-reports/'+encodeURIComponent(report.report_id)+'/triage',{decision:'accept',run_id:run.run_id,platform:platform.field.value,owner:owner.field.value,incident_kind:kind.value});row.remove();}),button('Dismiss public report',async()=>{await api('/v1/public-incident-reports/'+encodeURIComponent(report.report_id)+'/triage',{decision:'dismiss',owner:owner.field.value});row.remove();}));panel.append(row);}
 if(!queue.reports.length)panel.append(node('p','No pending public reports for this identity.'));
}
function operatorPanels(run,card){
 const panel=node('div');card.append(button('Activity, standing orders and incidents',async()=>{
  const state=await api('/v1/console/state?run_id='+encodeURIComponent(run.run_id)+'&since='+(activityCursors.get(run.run_id)||0));activityCursors.set(run.run_id,state.cursor);panel.replaceChildren(node('h3','Activity since last visit'),node('pre',json(state.activity)),node('p','Active human ledger: '+json(state.human)),node('h3','Standing rejections'));
  for(const rule of state.standing_rejections){const row=node('article');row.append(node('pre',json(rule)),button('Revoke standing rejection',async()=>{await api('/v1/asks/standing/'+encodeURIComponent(rule.rule_id)+'/revoke',{});row.remove();}));panel.append(row);}if(!state.standing_rejections.length)panel.append(node('p','No standing rejections.'));
  panel.append(node('h3','Incidents and human owners'),node('pre',json(state.incidents)),node('h3','Contamination log'),node('pre',json(state.contamination)));
  await incomingIncidentReports(run,panel);
  if(['running','frozen'].includes(run.state)){const platform=input('Incident platform'),owner=input('Human owner'),detail=input('Incident detail','textarea'),kind=node('select');for(const value of ['complaint','takedown','suspension','spam','retraction'])kind.append(node('option',value));panel.append(platform.wrap,owner.wrap,kind,detail.wrap,button('Record incident and revoke affected authority',async()=>{const result=await api('/v1/incidents',{run_id:run.run_id,platform:platform.field.value,incident_kind:kind.value,owner:owner.field.value,detail:detail.field.value});detail.field.value='';panel.append(node('pre',json(result)));}));const contamination=input('Ad hoc help or pasted material','textarea'),seconds=input('Actual additional human seconds (maximum 600)','number'),contaminationKind=node('select');seconds.field.value='0';for(const value of ['ad_hoc_help','hint','frontier_paste','other'])contaminationKind.append(node('option',value));panel.append(contaminationKind,contamination.wrap,seconds.wrap,button('Record contamination',async()=>{await api('/v1/contamination',{run_id:run.run_id,kind:contaminationKind.value,owner:owner.field.value,detail:contamination.field.value,human_seconds:Number(seconds.field.value)});contamination.field.value='';document.querySelector('#notice').textContent='Contamination recorded; run marked tainted.';}));}
 }),panel);
}
async function refresh(){
 clearTimeout(idleTimer);for(const id of openTickets)await touch(id,false);openTickets.clear();
 const [bridge,asks,browsers]=await Promise.all([api('/v1/bridge'),api('/v1/asks'),api('/v1/sessions')]);
 const runs=document.querySelector('#runs');runs.replaceChildren();
 for(const run of bridge.runs){const card=node('article');card.append(node('strong',run.run_id),node('p',run.state+' · '+run.reply_policy));
 for(const message of run.messages.slice(-5))card.append(node('pre',message.agent_text));
 if(run.state==='running')card.append(button('Freeze',async()=>{await api('/v1/freeze',{run_id:run.run_id});await refresh();}),button('End and seal',async()=>{await api('/v1/beam-up',{run_id:run.run_id});await refresh();}));
 if(run.state==='frozen')card.append(button('Resume',async()=>{await api('/v1/resume',{run_id:run.run_id});await refresh();}));operatorPanels(run,card);runs.append(card);}
 if(!bridge.runs.length)runs.textContent='No runs.';
 const tickets=document.querySelector('#tickets');tickets.replaceChildren();
 const pendingTickets=asks.tickets.filter(ticket=>['open','accepted'].includes(ticket.state)||(ticket.kind==='grant_payment'&&ticket.state==='approved'&&!issuedPayments.has(ticket.ticket_id))).sort((a,b)=>Number(b.kind==='takeover')-Number(a.kind==='takeover'));
 const blockers=node('div'),batch=node('div');blockers.append(node('h3','Session and credential blockers'));batch.append(node('h3','Approval and policy batch'),node('p','Review this batch alongside activity since the last visit. Each answer binds only its displayed action.'));if(pendingTickets.length)tickets.append(blockers,batch);
 for(const ticket of pendingTickets){const details=node('details');details.append(node('summary',ticket.kind+' · '+ticket.state+' · '+ticket.ticket_id),node('pre',json(ticket.body)),node('p',ticket.agent_text||''),node('pre',json(ticket.provenance)));
 const kind=node('select');for(const value of ['blocker','approval','diagnostic','choice']){const option=node('option',value);option.value=value;kind.append(option);}kind.value=ticket.kind==='approval'||ticket.kind==='grant_payment'?'approval':'blocker';const why=input('Reason');const standing=input('Standing rejection for this kind/platform/scope','checkbox');details.append(node('label','Ask classification'),kind,why.wrap,standing.wrap);
 const issuePayment=async()=>{await api('/v1/mandates',{run_id:ticket.run_id,...ticket.body});issuedPayments.add(ticket.ticket_id);document.querySelector('#notice').textContent='Exact single-use payment mandate issued; payment requires the matching observed quote.';};
 const answer=async(decision)=>{await touch(ticket.ticket_id,false);await api('/v1/asks/'+encodeURIComponent(ticket.ticket_id)+'/answer',{decision,ask_class:kind.value,reason:why.field.value,standing:decision==='reject'&&standing.field.checked});openTickets.delete(ticket.ticket_id);document.querySelector('#notice').textContent='Answer recorded; the agent receives its typed outcome.';if(ticket.kind==='grant_payment'&&decision==='approve'&&kind.value!=='choice')await issuePayment();await refresh();};
 if(ticket.state==='open')details.append(button('Approve exact action',()=>answer('approve')),button('Reject',()=>answer('reject')),button('Mark ignored',async()=>{await touch(ticket.ticket_id,false);await api('/v1/asks/'+encodeURIComponent(ticket.ticket_id)+'/ignore',{});openTickets.delete(ticket.ticket_id);await refresh();}));
 if(ticket.kind==='grant_credential'&&ticket.state==='open')details.append(button('Accept secure deposit',()=>answer('deposit')));
 if(ticket.kind==='grant_payment'&&ticket.state==='approved')details.append(button('Issue exact approved mandate',async()=>{await issuePayment();await refresh();}));
 if(ticket.kind==='approval'&&ticket.provenance?.lease_scope_blocked){const amendment=input('Explicit delegation scope amendment JSON','textarea');details.append(amendment.wrap,button('Prepare scope amendment for review',async()=>{const account=await api('/v1/vault/accounts/'+encodeURIComponent(ticket.body.account_id)+'?run_id='+encodeURIComponent(ticket.run_id));amendment.field.value=json({scope_classes:[...new Set([...account.scope_classes,ticket.body.scope])],scope_rules:{...account.scope_rules,[ticket.body.scope]:[ticket.body.request.url]}});}),button('Apply reviewed delegation amendment',async()=>{await api('/v1/vault/accounts/'+encodeURIComponent(ticket.body.account_id)+'/scope',{run_id:ticket.run_id,...parseObject(amendment.field)});document.querySelector('#notice').textContent='Delegation amended explicitly; purchase and first-contact approvals still apply.';}));}
 if(ticket.kind==='grant_credential'&&ticket.state==='accepted'){const alias=input('Account alias');alias.field.value=ticket.body.alias||ticket.body.request?.alias||'';alias.field.readOnly=Boolean(alias.field.value);const create=input('Create a new delegation','checkbox');const metadata=input('New delegation metadata JSON: identity, principal, reviewed platform, scopes and origin','textarea');metadata.field.value=json({platform:'',identity_id:'',principal:'',kind:'api_key',label:'bot_labelled',scope_classes:['read'],origin_url:'',scope_rules:{read:[]}});const credential=input('Secure credential JSON','textarea');details.append(alias.wrap,create.wrap,metadata.wrap,credential.wrap,button('Complete secure deposit',async()=>{let value;try{value=parseObject(credential.field);await touch(ticket.ticket_id,false);if(!alias.field.value.trim())throw Error('An account alias is required.');if(create.field.checked){await api('/v1/vault/accounts',{...parseObject(metadata.field),alias:alias.field.value,run_id:ticket.run_id,credential:value});}else{await api('/v1/vault/accounts/'+encodeURIComponent(alias.field.value)+'?run_id='+encodeURIComponent(ticket.run_id));await api('/v1/vault/accounts/'+encodeURIComponent(alias.field.value)+'/credential',{credential:value});}await api('/v1/asks/'+encodeURIComponent(ticket.ticket_id)+'/deposit-complete',{accepted:true});}finally{credential.field.value='';value=null;}await refresh();}));}
 details.addEventListener('toggle',()=>{if(details.open&&['open','accepted'].includes(ticket.state)){guard(()=>focusTicket(ticket.ticket_id));}else if(openTickets.has(ticket.ticket_id)){openTickets.delete(ticket.ticket_id);guard(()=>touch(ticket.ticket_id,false));}});(['takeover','grant_credential'].includes(ticket.kind)?blockers:batch).append(details);}
 if(!pendingTickets.length)tickets.textContent='No open tickets.';
 const sessions=document.querySelector('#sessions');sessions.replaceChildren();
 for(const session of browsers.sessions){const card=node('article');card.append(node('strong',session.session_id),node('pre',json(session)));const ticket=input('Accepted takeover ticket id');ticket.field.value=session.ticket_id||'';const params=input('Human action parameters JSON','textarea');const tool=node('select');for(const value of ['goto','click','type','press','scroll','select'])tool.append(node('option',value));const output=node('pre'),picture=node('img');picture.alt='World browser view for the researcher';picture.hidden=true;
 card.append(ticket.wrap,button('Take the conn',async()=>{await api('/v1/sessions/'+encodeURIComponent(session.session_id)+'/takeover',{ticket_id:ticket.field.value});await refresh();}),button('Return the conn',async()=>{await api('/v1/sessions/'+encodeURIComponent(session.session_id)+'/takeover-done',{});params.field.value='';await refresh();}),button('Human snapshot',async()=>{const result=await api('/v1/sessions/'+encodeURIComponent(session.session_id)+'/human-snapshot',{view:'both'});output.textContent=result.tree||'';if(typeof result.screenshot_data_url==='string'&&result.screenshot_data_url.startsWith('data:image/png;base64,')){picture.src=result.screenshot_data_url;picture.hidden=false;}}),tool,params.wrap,button('Perform human action',async()=>{try{await focusTicket(ticket.field.value);await api('/v1/sessions/'+encodeURIComponent(session.session_id)+'/human-action',{tool:tool.value,params:parseObject(params.field)});}finally{params.field.value='';}}),picture,output);if(session.state==='human_held'&&session.ticket_id&&!openTickets.size)await focusTicket(session.ticket_id);sessions.append(card);}
 if(!browsers.sessions.length)sessions.textContent='No browser sessions.';
}
async function visibility(){const active=document.visibilityState==='visible'&&document.hasFocus();for(const id of openTickets)await touch(id,active);}
window.addEventListener('focus',()=>guard(visibility));window.addEventListener('blur',()=>guard(visibility));document.addEventListener('visibilitychange',()=>guard(visibility));for(const name of ['pointerdown','keydown','touchstart'])document.addEventListener(name,activity,{passive:true});window.addEventListener('pagehide',()=>{clearTimeout(idleTimer);for(const id of openTickets){const headers={'Content-Type':'application/json'};if(controlToken)headers['X-World-Control-Token']=controlToken;fetch('/v1/asks/'+encodeURIComponent(id)+'/touch',{method:'POST',headers,cache:'no-store',body:json({active:false}),keepalive:true}).catch(()=>{});}controlToken='';document.querySelector('#credential').value='';});
document.querySelector('#connect').addEventListener('click',()=>guard(async()=>{controlToken=document.querySelector('#credential').value;document.querySelector('#credential').value='';await refresh();}));

</script></html>
